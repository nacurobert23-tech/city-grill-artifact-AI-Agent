<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>City Grill Performance Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-width red branded header, grey page, dark cards, 4 rounded KPI cards, chart + side panel rows, compact table. */
:root{
  /* v6: v3 layout (red header, grey #52585C page) with dark chart cards. Palette: #B81C1C #FBF1EA #52585C #A3574A #A8ABAC #E4B2A9 #B93A23 #6E7477, plus dark card neutrals. Single dark look. */
  --bg:#52585C; --card:#2B2F32; --ink:#FBF1EA; --muted:#C3C6C7; --line:#454B4F; --soft:#363B3E;
  --red:#B81C1C; --red-2:#B93A23; --up:#FBF1EA; --warn:#E4B2A9; --hatch:#FBF1EA;
  --hero:#B81C1C; --hero-ink:#FBF1EA; --hero-muted:#FBF1EA; --pill:rgba(251,241,234,.12); --pill-line:rgba(251,241,234,.35);
  --tip:#FBF1EA; --grey:#A8ABAC; --pink:#E4B2A9; --brown:#A3574A; --on:#FBF1EA; --data:#E5483F;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;padding-inline:0;padding-block:0}
a{color:var(--red);text-decoration-thickness:1px;text-underline-offset:2px}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-2);outline-offset:2px}
.hero{background:var(--hero);color:var(--hero-ink);padding-inline:16px;padding-block:30px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -60% auto;width:520px;height:320px;background:radial-gradient(closest-side,rgba(185,54,38,.30),transparent);pointer-events:none}
.hero-in{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted);font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red-2)}
h1{margin:6px 0 4px;font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.lede{margin:0;color:var(--hero-muted);font-size:14px;max-width:60ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pill);border:1px solid var(--pill-line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--red-2)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted);min-height:32px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--red);color:#fff}
.reset{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer;min-height:38px}
.reset:hover{border-color:var(--red);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:0 1px 2px rgba(34,37,61,.06)}
.kpi.focus{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.k-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:30px}
.k-l{font-size:12.5px;font-weight:700;color:var(--muted)}
.k-v{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.k-v.na{font-size:18px;color:var(--muted);font-weight:700;padding-block:5px}
.k-s{font-size:12.5px;color:var(--muted)}
.k-s b{color:var(--ink)}
.k-x{font-size:11.5px;color:var(--muted);margin-top:4px;border-top:1px dashed var(--line);padding-top:6px}
.up{color:var(--up);font-weight:700} .warn{color:var(--warn);font-weight:600} .mut{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:1px 8px}
.tbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--soft);margin-top:6px}
.tb1{background:var(--ink);opacity:.85} .tb2{flex:1;background:repeating-linear-gradient(45deg,var(--red) 0 3px,transparent 3px 6px)}
.spark{flex:none}
.sp-line{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round} .sp-dash{stroke-dasharray:3 3}
.sp-dot{fill:var(--card);stroke:var(--red);stroke-width:1.5} .sp-dot.on{fill:var(--red)}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0;box-shadow:0 1px 2px rgba(34,37,61,.06)}
.c-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.c-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative;width:100%}
svg{display:block;max-width:100%;overflow:visible}
.grid{stroke:var(--line);stroke-width:1} .zero{stroke:var(--muted);stroke-width:1.2}
.ax{fill:var(--muted);font-size:11.5px;font-family:var(--font);font-variant-numeric:tabular-nums} .ax-on{fill:var(--red);font-weight:800}
.nd{font-style:italic;font-size:10.5px}
.band{fill:var(--red);opacity:.06}
.ag-top{stop-color:var(--red);stop-opacity:.22} .ag-bot{stop-color:var(--red);stop-opacity:0}
.ln{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ln-tgt{stroke:var(--ink);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;opacity:.75}
.mk{fill:var(--red);stroke:var(--card);stroke-width:2.5} .mk-base{fill:var(--card);stroke:var(--red);stroke-width:2.2}
.mk-tgt{fill:var(--card);stroke:var(--ink);stroke-width:2} .mk-tgt.on{fill:var(--ink)}
.vl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--font);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.pt{cursor:pointer} .pt:focus-visible{outline:none} .pt:focus-visible .mk,.pt:focus-visible .mk-tgt,.pt:focus-visible rect{stroke:var(--ink);stroke-width:2.5}
.b-ok{fill:var(--red)} .b-cons{fill:url(#hatch);stroke:var(--hatch);stroke-width:1.4}
.h-bg{fill:var(--card)} .h-ln{stroke:var(--hatch);opacity:.55}
.gapdot{fill:var(--card);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 2}
.tt{position:absolute;z-index:5;pointer-events:none;width:226px;background:var(--hero);color:var(--hero-ink);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tt-y{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted);font-weight:700}
.tt-v{font-size:19px;font-weight:800}
.foot{font-size:12px;color:var(--muted);margin-top:8px}
.warnbox{background:var(--soft);border-radius:10px;padding:8px 12px;color:var(--ink)}
.side{display:flex;flex-direction:column}
.dl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:7px 12px;margin:6px 0 0;font-size:12.5px}
.dl dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:2px}
.dl dd{margin:0;overflow-wrap:anywhere} .dl .big{font-size:20px;font-weight:800}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px}
.st-rep{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.st-tgt{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.st-calc{background:var(--soft);color:var(--muted)}
.empty{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-top:6px}
.empty b{color:var(--ink)}
.lnk{border:0;background:none;color:var(--red);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.meth{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--soft);padding:8px 12px;white-space:nowrap}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
th.n,td.n{text-align:right}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
tbody tr.on{background:color-mix(in srgb,var(--red) 8%,transparent);box-shadow:inset 3px 0 0 var(--red)}
td.b{font-weight:700}
.k-c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.b-tgt{fill:color-mix(in srgb,var(--red) 14%,transparent);stroke:var(--red);stroke-width:1.6;stroke-dasharray:4 3}
.b-h1{fill:url(#hatch2);stroke:var(--muted);stroke-width:1.2} .h-ln2{stroke:var(--muted);opacity:.7}
.acq{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px}
.a-yes{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)} .a-no{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)} .a-unk{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.acq-l{display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:3px}

/* palette overrides */
.hero::after{background:radial-gradient(closest-side,rgba(185,58,35,.55),transparent)}
.eyebrow{color:var(--hero-ink);opacity:.85} .dot,.pill i{background:var(--hero-ink)}
.ctl-l{color:var(--on)}
.reset{background:var(--card);border-color:var(--on);color:var(--ink)} .reset:hover{background:var(--red);border-color:var(--red);color:var(--on)}
.seg{border-color:var(--on)} .seg button{color:var(--muted)} .seg button.on{background:var(--red);color:var(--on)}
.kpi,.card{border-color:var(--pink);box-shadow:none}
.up{color:var(--ink)}
.grid{stroke:var(--pink);opacity:.7} .zero{stroke:var(--muted)}
.band{fill:var(--pink);opacity:.45}
.tt{background:var(--tip);color:var(--on)} .tt-y{color:var(--pink)}
.b-tgt{fill:var(--pink);stroke:var(--red-2);stroke-width:1.6;stroke-dasharray:4 3}
.b-h1{stroke:var(--muted)} .h-ln2{stroke:var(--grey);opacity:1} .h-ln{stroke:var(--brown);opacity:.85} .b-cons{stroke:var(--brown)}
.st-rep{background:var(--ink);color:var(--on)} .st-tgt{background:var(--pink);color:var(--red)} .st-calc{background:var(--grey);color:var(--ink)}
.a-yes{background:var(--red-2);color:var(--on)} .a-no{background:var(--muted);color:var(--on)} .a-unk{background:var(--brown);color:var(--on)}
.gr{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:800;padding:0 5px}
.gr-A{background:var(--red);color:var(--on)} .gr-B{background:var(--pink);color:var(--ink)}
.gnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:4px}
.gi{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);margin-right:10px}
.logo-badge{position:absolute;top:0;right:0;background:var(--ink);border-radius:12px;padding:8px 12px;line-height:0}
.logo-badge img{height:44px;width:auto;display:block}
.hero-in{padding-right:150px}
@media (max-width:640px){.hero-in{padding-right:0}.logo-badge{position:static;display:inline-block;margin-bottom:14px}}
.warnbox{background:var(--soft)}
th{background:var(--soft)} tbody tr:hover{background:var(--soft)} tbody tr.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--red)}
.tbar{background:var(--soft)} .tb1{background:var(--ink);opacity:1} .tb2{background:repeating-linear-gradient(45deg,var(--red) 0 3px,transparent 3px 6px)}
.k-x{border-top-color:var(--pink)}

/* v6 dark-card overrides */
.kpi,.card{border-color:var(--line);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.kpi.focus{border-color:var(--data);box-shadow:0 0 0 1px var(--data) inset}
.reset{background:var(--card);border-color:var(--line);color:var(--ink)} .reset:hover{background:var(--red);border-color:var(--red);color:var(--on)}
.seg{background:var(--card);border-color:var(--line)} .seg button{color:var(--muted)} .seg button:hover{color:var(--ink)}
a{color:var(--pink)} .lnk{color:var(--pink)}
.ln{stroke:var(--data)} .mk{fill:var(--data);stroke:var(--card)} .mk-base{stroke:var(--data);fill:var(--card)}
.ag-top{stop-color:var(--data);stop-opacity:.35} .ag-bot{stop-color:var(--data);stop-opacity:0}
.mk-tgt{fill:var(--card);stroke:var(--ink)} .mk-tgt.on{fill:var(--ink)} .ln-tgt{stroke:var(--ink)}
.b-ok{fill:var(--data)} .b-cons{fill:url(#hatch);stroke:var(--pink)} .h-bg{fill:var(--card)} .h-ln{stroke:var(--pink);opacity:.8}
.b-tgt{fill:rgba(228,178,169,.18);stroke:var(--pink)} .b-h1{stroke:var(--grey)} .h-ln2{stroke:var(--grey)}
.sp-line{stroke:var(--data)} .sp-dot{fill:var(--card);stroke:var(--data)} .sp-dot.on{fill:var(--data)}
.grid{stroke:var(--line);opacity:1} .zero{stroke:var(--muted)} .band{fill:var(--on);opacity:.06}
.ax-on{fill:var(--pink)} .vl{fill:var(--ink);stroke:var(--card)}
.tt{background:var(--tip);color:#2B2F32} .tt-y{color:var(--red)}
.st-rep{background:var(--on);color:#2B2F32} .st-tgt{background:var(--pink);color:var(--red)} .st-calc{background:var(--grey);color:#2B2F32}
.gr-A{background:var(--red);color:var(--on)} .gr-B{background:var(--pink);color:#2B2F32}
.tag{color:var(--pink);border-color:var(--pink)}
.logo-badge{background:#2B2F32}
.tbar{background:var(--soft)} .tb1{background:var(--ink)} .tb2{background:repeating-linear-gradient(45deg,var(--data) 0 3px,transparent 3px 6px)}
th{background:var(--soft)} tbody tr:hover{background:var(--soft)} tbody tr.on{background:rgba(184,28,28,.22);box-shadow:inset 3px 0 0 var(--data)}
.gnote,.warnbox{background:var(--soft)} .gi{color:var(--ink)}
.k-x{border-top-color:var(--line)}
.a-no{background:#6E7477;color:var(--on)}
.up{color:#5FC181;font-weight:700} .vl-up{fill:#5FC181}
.h1-ln{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.h1-t{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--font);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.tt-h1{margin-top:4px;padding-top:4px;border-top:1px solid rgba(43,47,50,.2)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.row{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.kpis{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.reset{margin-left:0}.seg button{padding:6px 10px}.hero{padding-block:22px 20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
